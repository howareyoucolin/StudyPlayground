<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel the Beast</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="main-header">
        <div class="header-left">
            <div class="avatar"></div>
            <span class="logo-text">Marvel the Beast</span>
        </div>
        <div class="header-right">
            <a href="#" class="nav-link">Info</a>
            <button class="download-btn">
                Download
                <span class="arrow">→</span>
            </button>
        </div>
    </header>

    <main>
        <div class="courtesy-text">COURTESY OF ONE PAGE LOVE</div>
        
        <h1 class="main-headline">
            A minimal portfolio template to showcase your work in one page.
        </h1>

        <div class="showcase-card">
            <div class="card-gradient">
                <div class="sphere"></div>
            </div>
        </div>

        <div class="project-section">
            <div class="project-info">
                <span class="project-title">Project one with slider</span>
                <div class="project-nav">
                    <a href="#" class="nav-arrow">Prev</a>
                    <a href="#" class="nav-arrow">Next</a>
                </div>
            </div>
            <p class="project-description">
                Explores the boundaries <span class="highlight">between light</span>, texture, and motion through a single, meticulously crafted 3D
            </p>
        </div>
    </main>
</body>
</html>
